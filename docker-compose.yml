services:
  bot:
    build: .
    container_name: fo40-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container, fastify must bind to 0.0.0.0 so Docker's
      # port-forwarding (eth0 -> host) can reach it. The host-side mapping
      # below pins the public surface to 127.0.0.1, so 0.0.0.0 inside the
      # container is still effectively localhost-only from outside the host.
      - WEB_SERVER_HOST=0.0.0.0
    # Expose the web server on localhost only - nginx in front (and
    # Cloudflare in front of that) handles public access. The HOST-side
    # port is configurable via FO40_HOST_PORT in .env so you can avoid
    # collisions with other apps on the same machine. Container internally
    # listens on 8080 regardless.
    ports:
      - "127.0.0.1:${FO40_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
